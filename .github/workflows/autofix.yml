name: autofix.ci # needed to securely identify the workflow

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  autofix:
    name: autofix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        uses: wevm/actions/.github/actions/pnpm@b518cf981b50a4c745a8b7335fc693f34b108a75

      - name: Check code
        run: pnpm check

      - name: Update package versions
        run: pnpm version:update

      - name: Apply fixes
        uses: wevm/actions/vendor/autofix-ci/action/v1.3.2@b518cf981b50a4c745a8b7335fc693f34b108a75
        with:
          fail-fast: false
          commit-message: 'ci: apply automated fixes'
