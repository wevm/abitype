name: Autofix

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  autofix:
    name: autofix
    uses: wevm/actions/.github/workflows/autofix.yml@e7e7cfb7fcb3a6e6db894c6b784aa4515f19d2fa
    permissions:
      contents: read
      id-token: write
    with:
      command: |
        pnpm check
        pnpm version:update
