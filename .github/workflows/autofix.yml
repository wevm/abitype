name: autofix.ci # needed to securely identify the workflow

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  autofix:
    name: autofix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install dependencies
        uses: wevm/actions/.github/actions/pnpm@8963daf30237417f873c8e2f17e3bf9415e3a7b9

      - name: Check code
        run: pnpm check

      - name: Update package versions
        run: pnpm version:update

      - name: Apply fixes
        uses: wevm/actions/vendor/autofix-ci/action/v1.3.2@8963daf30237417f873c8e2f17e3bf9415e3a7b9
        with:
          fail-fast: false
          commit-message: 'ci: apply automated fixes'
