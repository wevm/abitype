name: Verify
on:
  workflow_call:
  workflow_dispatch:

jobs:
  check:
    name: Check
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Clone repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install dependencies
        uses: wevm/actions/.github/actions/pnpm-v4@67ad93da5866fc6ad24c25e49e5e8efabc08c718

      - name: Check repo
        run: pnpm check:repo

  build:
    name: Build
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Clone repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install dependencies
        uses: wevm/actions/.github/actions/pnpm-v4@67ad93da5866fc6ad24c25e49e5e8efabc08c718

      - name: Build
        run: pnpm build

      - name: Publint
        run: pnpm test:build

      - name: Check for unused files, dependencies, and exports
        run: pnpm knip --production

  types:
    name: Types
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        version:
          [
            '5.0.4',
            '5.2.2',
            '5.3.3',
            '5.4.5',
            '5.5.4',
            '5.6.3',
            '5.7.3',
            '5.8.3',
            '5.9.3',
            '6.0.3',
            'latest',
          ]

    steps:
      - name: Clone repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install dependencies
        uses: wevm/actions/.github/actions/pnpm-v4@67ad93da5866fc6ad24c25e49e5e8efabc08c718

      - name: Use `typescript@${{ matrix.version }}`
        run: pnpm add -D -w typescript@${{ matrix.version }}

      - name: Link packages
        run: pnpm preconstruct

      - name: Bench types
        # TODO: Re-enable for `latest` once @ark/attest supports TypeScript 7.
        if: matrix.version != 'latest'
        run: pnpm bench:types

      - name: Check types
        run: pnpm check:types

      - name: Check types (--exactOptionalPropertyTypes false)
        run: pnpm check:types:propertyTypes

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Clone repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install dependencies
        uses: wevm/actions/.github/actions/pnpm-v4@67ad93da5866fc6ad24c25e49e5e8efabc08c718

      - name: Run tests
        run: pnpm test:cov

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
